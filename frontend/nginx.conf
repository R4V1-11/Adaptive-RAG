server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # PDFs up to 5 MB (nginx defaults to 1 MB).
    client_max_body_size 6m;

    # Same /api prefix the Vite dev proxy uses.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
